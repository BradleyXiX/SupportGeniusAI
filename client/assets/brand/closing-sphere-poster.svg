  <!-- Cluster 1: Upper-Left (Dense Garnet Core & Wine Halos) -->
  <g>
    <circle cx="130" cy="134" r="3.2" fill="#2E050A" />
    <circle cx="134" cy="138" r="2.8" fill="#4A0812" />
    <circle cx="127" cy="138" r="2.4" fill="#6B0D17" />
    <circle cx="135" cy="131" r="2.2" fill="#7A0C1A" />
    <circle cx="124" cy="133" r="1.8" fill="#A51424" />
    <circle cx="138" cy="142" r="1.9" fill="#BB1729" />
    <circle cx="128" cy="143" r="1.6" fill="#8B0E1E" />
    <circle cx="139" cy="135" r="1.7" fill="#BB1729" />
  </g>

  <!-- Cluster 2: Lower-Right (Dense Garnet Core & Wine Halos) -->
  <g>
    <circle cx="228" cy="216" r="3.2" fill="#2E050A" />
    <circle cx="224" cy="212" r="2.7" fill="#4A0812" />
    <circle cx="232" cy="220" r="2.5" fill="#6B0D17" />
    <circle cx="222" cy="218" r="2.2" fill="#7A0C1A" />
    <circle cx="234" cy="213" r="1.9" fill="#A51424" />
    <circle cx="218" cy="215" r="1.7" fill="#BB1729" />
    <circle cx="236" cy="224" r="1.6" fill="#8B0E1E" />
    <circle cx="225" cy="223" r="1.8" fill="#BB1729" />
  </g>

  <!-- Cluster 3: Upper-Right (Dense Garnet Core & Wine Halos) -->
  <g>
    <circle cx="220" cy="128" r="3.0" fill="#2E050A" />
    <circle cx="216" cy="132" r="2.6" fill="#4A0812" />
    <circle cx="224" cy="133" r="2.3" fill="#6B0D17" />
    <circle cx="224" cy="124" r="2.0" fill="#7A0C1A" />
    <circle cx="213" cy="126" r="1.8" fill="#A51424" />
    <circle cx="227" cy="138" r="1.6" fill="#BB1729" />
    <circle cx="217" cy="137" r="1.7" fill="#8B0E1E" />
  </g>

  <!-- Cluster 4: Lower-Left (Dense Garnet Core & Wine Halos) -->
  <g>
    <circle cx="138" cy="224" r="3.0" fill="#2E050A" />
    <circle cx="142" cy="220" r="2.6" fill="#4A0812" />
    <circle cx="134" cy="228" r="2.2" fill="#6B0D17" />
    <circle cx="143" cy="226" r="2.1" fill="#7A0C1A" />
    <circle cx="133" cy="221" r="1.8" fill="#A51424" />
    <circle cx="146" cy="218" r="1.7" fill="#BB1729" />
    <circle cx="140" cy="231" r="1.6" fill="#8B0E1E" />
  </g>

  <!-- Cluster 5: Center Core Nucleus (Deepest Garnet & Radiant Wine Sparks) -->
  <g>
    <circle cx="182" cy="176" r="3.8" fill="#18181C" />
    <circle cx="180" cy="174" r="3.2" fill="#2E050A" />
    <circle cx="185" cy="178" r="2.8" fill="#4A0812" />
    <circle cx="178" cy="179" r="2.5" fill="#6B0D17" />
    <circle cx="186" cy="173" r="2.3" fill="#7A0C1A" />
    <circle cx="175" cy="174" r="2.0" fill="#A51424" />
    <circle cx="189" cy="180" r="1.8" fill="#BB1729" />
    <circle cx="180" cy="183" r="1.7" fill="#BB1729" />
    <circle cx="174" cy="180" r="1.5" fill="#8B0E1E" />
  </g>

  <!-- Fine Foreground Spark Accent Nodes -->
  <g fill="#BB1729" opacity="0.95">
    <circle cx="182" cy="176" r="1.2" fill="#F7F7F5" />
    <circle cx="130" cy="134" r="1.1" fill="#F7F7F5" />
    <circle cx="228" cy="216" r="1.1" fill="#F7F7F5" />
    <circle cx="220" cy="128" r="1.0" fill="#F7F7F5" />
    <circle cx="138" cy="224" r="1.0" fill="#F7F7F5" />
  </g>
</svg>
