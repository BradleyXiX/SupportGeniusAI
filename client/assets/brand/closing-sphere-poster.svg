<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none" aria-hidden="true">
  <defs>
    <!-- Background spherical depth gradient for light paper -->
    <radialGradient id="closing-sphere-depth" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#BB1729" stop-opacity="0.10" />
      <stop offset="45%" stop-color="#8B0E1E" stop-opacity="0.06" />
      <stop offset="80%" stop-color="#540612" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#540612" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cluster-glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A0C1A" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#BB1729" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#BB1729" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cluster-glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E050A" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#7A0C1A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#BB1729" stop-opacity="0" />
    </radialGradient>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
  </defs>

  <!-- Spherical depth envelope -->
  <circle cx="180" cy="180" r="145" fill="url(#closing-sphere-depth)" />

  <!-- Fluid orbital contour curves (fine wine / crimson) -->
  <g stroke-linecap="round" fill="none" opacity="0.65">
    <!-- Outer boundary contours -->
    <path d="M 180,35 C 260,35 325,100 325,180 C 325,260 260,325 180,325 C 100,325 35,260 35,180 C 35,100 100,35 180,35 Z" stroke="#8B0E1E" stroke-width="0.8" stroke-dasharray="2 4" />
    <path d="M 180,39 C 256,42 321,104 321,180 C 320,256 256,321 180,321 C 104,321 39,256 39,180 C 40,104 104,41 180,39 Z" stroke="#BB1729" stroke-width="0.6" stroke-dasharray="1 5" opacity="0.5" />

    <!-- Tilted spherical wave rings -->
    <ellipse cx="180" cy="180" rx="140" ry="62" stroke="#7A0C1A" stroke-width="1.0" transform="rotate(-22 180 180)" stroke-dasharray="4 8 2 8" opacity="0.6" />
    <ellipse cx="180" cy="180" rx="136" ry="48" stroke="#A51424" stroke-width="0.9" transform="rotate(-15 180 180)" stroke-dasharray="3 6" opacity="0.55" />
    <ellipse cx="180" cy="180" rx="138" ry="76" stroke="#8B0E1E" stroke-width="0.8" transform="rotate(35 180 180)" stroke-dasharray="5 7" opacity="0.5" />
    <ellipse cx="180" cy="180" rx="132" ry="34" stroke="#BB1729" stroke-width="0.75" transform="rotate(12 180 180)" stroke-dasharray="2 6 4 6" opacity="0.6" />
  </g>

  <!-- Fluid wave ripples across shell surface -->
  <g stroke="#941022" stroke-width="0.85" fill="none" opacity="0.55" stroke-dasharray="3 5">
    <path d="M 68,140 Q 115,105 180,122 T 292,150" />
    <path d="M 62,175 Q 120,150 180,165 T 298,185" />
    <path d="M 72,210 Q 125,195 180,210 T 288,220" />
    <path d="M 95,245 Q 138,238 180,248 T 265,255" />
  </g>

  <!-- Cluster Glow Backdrops -->
  <g filter="url(#subtle-blur)">
    <!-- Cluster 1 (upper left) -->
    <circle cx="132" cy="136" r="28" fill="url(#cluster-glow-1)" />
    <!-- Cluster 2 (lower right) -->
    <circle cx="228" cy="216" r="26" fill="url(#cluster-glow-1)" />
    <!-- Cluster 3 (upper right) -->
    <circle cx="220" cy="130" r="25" fill="url(#cluster-glow-1)" />
    <!-- Cluster 4 (lower left) -->
    <circle cx="138" cy="224" r="24" fill="url(#cluster-glow-1)" />
    <!-- Cluster 5 (central core) -->
    <circle cx="182" cy="176" r="26" fill="url(#cluster-glow-core)" />
  </g>

  <!-- Outer Shell Stippled Particle Points (Wine / Crimson) -->
  <g fill="#7A0C1A" opacity="0.75">
    <!-- Top hemisphere shell -->
    <circle cx="180" cy="44" r="1.6" />
    <circle cx="198" cy="47" r="1.4" />
    <circle cx="162" cy="48" r="1.5" />
    <circle cx="216" cy="54" r="1.6" />
    <circle cx="144" cy="56" r="1.4" />
    <circle cx="234" cy="65" r="1.8" />
    <circle cx="126" cy="67" r="1.6" />
    <circle cx="250" cy="79" r="1.5" />
    <circle cx="110" cy="82" r="1.7" />
    <circle cx="266" cy="96" r="1.8" />
    <circle cx="94" cy="100" r="1.6" />
    <circle cx="280" cy="115" r="1.7" />
    <circle cx="80" cy="120" r="1.8" />
    <circle cx="292" cy="136" r="1.9" />
    <circle cx="68" cy="142" r="1.7" />
    <circle cx="302" cy="158" r="1.8" />
    <circle cx="58" cy="164" r="1.9" />
    <circle cx="308" cy="180" r="2.0" />
    <circle cx="52" cy="180" r="1.8" />

    <!-- Bottom hemisphere shell -->
    <circle cx="304" cy="202" r="1.9" />
    <circle cx="56" cy="198" r="1.8" />
    <circle cx="296" cy="224" r="1.7" />
    <circle cx="64" cy="220" r="1.8" />
    <circle cx="284" cy="244" r="1.8" />
    <circle cx="76" cy="240" r="1.6" />
    <circle cx="268" cy="264" r="1.7" />
    <circle cx="92" cy="260" r="1.8" />
    <circle cx="250" cy="281" r="1.6" />
    <circle cx="110" cy="278" r="1.7" />
    <circle cx="230" cy="295" r="1.8" />
    <circle cx="130" cy="292" r="1.6" />
    <circle cx="208" cy="306" r="1.5" />
    <circle cx="152" cy="304" r="1.6" />
    <circle cx="180" cy="314" r="1.8" />
  </g>

