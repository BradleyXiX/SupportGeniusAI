  <g fill="#BB1729" opacity="0.80">
    <circle cx="160" cy="74" r="1.6" />
    <circle cx="200" cy="72" r="1.7" />
    <circle cx="138" cy="92" r="1.8" />
    <circle cx="222" cy="90" r="1.9" />
    <circle cx="118" cy="114" r="1.7" />
    <circle cx="242" cy="112" r="1.8" />
    <circle cx="102" cy="140" r="1.9" />
    <circle cx="258" cy="138" r="1.8" />
    <circle cx="94" cy="168" r="1.8" />
    <circle cx="266" cy="166" r="2.0" />
    <circle cx="96" cy="196" r="1.7" />
    <circle cx="264" cy="194" r="1.9" />
    <circle cx="106" cy="224" r="1.8" />
    <circle cx="254" cy="222" r="1.8" />
    <circle cx="122" cy="250" r="1.7" />
    <circle cx="238" cy="248" r="1.9" />
    <circle cx="144" cy="272" r="1.8" />
    <circle cx="216" cy="270" r="1.6" />
    <circle cx="170" cy="286" r="1.7" />
    <circle cx="190" cy="286" r="1.8" />
  </g>

  <!-- Interior Lattice Points (Depth and Dimension) -->
  <g fill="#941022" opacity="0.70">
