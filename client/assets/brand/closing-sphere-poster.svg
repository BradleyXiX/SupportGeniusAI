<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none" aria-hidden="true">
  <defs>
    <!-- Background spherical depth gradient for light paper (dark wine, zero pink) -->
    <radialGradient id="closing-sphere-depth" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38080F" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#4D0912" stop-opacity="0.04" />
      <stop offset="85%" stop-color="#26050A" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#1A0306" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cluster-glow-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0306" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#38080F" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#4D0912" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cluster-glow-wine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26050A" stop-opacity="0.60" />
      <stop offset="50%" stop-color="#4D0912" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6B0D1A" stop-opacity="0" />
    </radialGradient>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" />
    </filter>
  </defs>

  <!-- Spherical depth envelope matching WebGL 122px apparent radius -->
  <circle cx="180" cy="180" r="122" fill="url(#closing-sphere-depth)" />

  <!-- Fluid orbital contour curves (deep wine / dark crimson) -->
  <g stroke-linecap="round" fill="none" opacity="0.65">
    <!-- Outer boundary contours matching WebGL silhouette -->
    <path d="M 180,58 C 247,58 302,113 302,180 C 302,247 247,302 180,302 C 113,302 58,247 58,180 C 58,113 113,58 180,58 Z" stroke="#4D0912" stroke-width="0.85" stroke-dasharray="2 4" />
    <path d="M 180,61 C 244,63 299,115 299,180 C 298,244 244,298 180,298 C 116,298 62,244 62,180 C 63,115 116,62 180,61 Z" stroke="#6B0D1A" stroke-width="0.65" stroke-dasharray="1 5" opacity="0.55" />

    <!-- Tilted spherical wave rings matching WebGL pitch & rotation -->
    <ellipse cx="180" cy="180" rx="120" ry="52" stroke="#38080F" stroke-width="1.0" transform="rotate(-22 180 180)" stroke-dasharray="4 8 2 8" opacity="0.65" />
    <ellipse cx="180" cy="180" rx="116" ry="40" stroke="#6B0D1A" stroke-width="0.9" transform="rotate(-15 180 180)" stroke-dasharray="3 6" opacity="0.60" />
    <ellipse cx="180" cy="180" rx="118" ry="64" stroke="#4D0912" stroke-width="0.8" transform="rotate(35 180 180)" stroke-dasharray="5 7" opacity="0.55" />
    <ellipse cx="180" cy="180" rx="114" ry="28" stroke="#7D1020" stroke-width="0.75" transform="rotate(12 180 180)" stroke-dasharray="2 6 4 6" opacity="0.65" />
  </g>

  <!-- Fluid wave ripples across shell surface -->
  <g stroke="#540612" stroke-width="0.85" fill="none" opacity="0.55" stroke-dasharray="3 5">
    <path d="M 85,146 Q 125,116 180,131 T 275,155" />
    <path d="M 80,176 Q 128,155 180,167 T 280,184" />
    <path d="M 88,206 Q 133,193 180,206 T 272,214" />
    <path d="M 108,235 Q 144,229 180,238 T 252,244" />
  </g>

  <!-- Cluster Glow Backdrops positioned at exact WebGL cluster coordinates -->
  <g filter="url(#subtle-blur)">
    <!-- Cluster 1 (upper-left: 152, 162) -->
    <circle cx="152" cy="162" r="20" fill="url(#cluster-glow-wine)" />
    <!-- Cluster 2 (lower-right: 205, 198) -->
    <circle cx="205" cy="198" r="19" fill="url(#cluster-glow-wine)" />
    <!-- Cluster 3 (upper-right: 201, 157) -->
    <circle cx="201" cy="157" r="18" fill="url(#cluster-glow-wine)" />
    <!-- Cluster 4 (lower-left: 157, 201) -->
    <circle cx="157" cy="201" r="18" fill="url(#cluster-glow-wine)" />
    <!-- Cluster 5 (central core: 182, 177) -->
    <circle cx="182" cy="177" r="21" fill="url(#cluster-glow-core)" />
  </g>

  <!-- Outer Shell Stippled Particle Points (Deep Wine & Garnet) -->
  <g fill="#38080F" opacity="0.88">
    <!-- Top hemisphere shell (r ~ 120px) -->
    <circle cx="180" cy="64" r="1.6" />
    <circle cx="195" cy="67" r="1.4" />
    <circle cx="165" cy="67" r="1.5" />
    <circle cx="210" cy="73" r="1.6" />
    <circle cx="150" cy="74" r="1.4" />
    <circle cx="225" cy="82" r="1.7" />
    <circle cx="135" cy="83" r="1.6" />
    <circle cx="238" cy="94" r="1.5" />
    <circle cx="122" cy="96" r="1.7" />
    <circle cx="251" cy="108" r="1.8" />
    <circle cx="109" cy="111" r="1.6" />
    <circle cx="263" cy="124" r="1.7" />
    <circle cx="98" cy="128" r="1.8" />
    <circle cx="273" cy="141" r="1.8" />
    <circle cx="88" cy="146" r="1.7" />
    <circle cx="281" cy="160" r="1.8" />
    <circle cx="80" cy="165" r="1.9" />
    <circle cx="286" cy="180" r="2.0" />
    <circle cx="74" cy="180" r="1.8" />

    <!-- Bottom hemisphere shell -->
    <circle cx="283" cy="198" r="1.9" />
    <circle cx="78" cy="195" r="1.8" />
    <circle cx="276" cy="216" r="1.7" />
    <circle cx="85" cy="213" r="1.8" />
    <circle cx="266" cy="233" r="1.8" />
    <circle cx="95" cy="230" r="1.6" />
    <circle cx="253" cy="249" r="1.7" />
    <circle cx="108" cy="246" r="1.8" />
    <circle cx="238" cy="263" r="1.6" />
    <circle cx="123" cy="261" r="1.7" />
    <circle cx="221" cy="275" r="1.8" />
    <circle cx="140" cy="273" r="1.6" />
    <circle cx="203" cy="284" r="1.5" />
    <circle cx="157" cy="283" r="1.6" />
    <circle cx="180" cy="292" r="1.8" />
  </g>

  <!-- Mid-depth Shell Points (Rich Wine #4D0912 / Dark Crimson #7D1020) -->
  <g fill="#4D0912" opacity="0.90">
    <circle cx="164" cy="88" r="1.6" />
    <circle cx="196" cy="86" r="1.7" />
    <circle cx="146" cy="103" r="1.8" />
    <circle cx="214" cy="101" r="1.8" />
    <circle cx="130" cy="122" r="1.7" />
    <circle cx="230" cy="120" r="1.8" />
    <circle cx="116" cy="144" r="1.9" />
    <circle cx="244" cy="142" r="1.8" />
    <circle cx="110" cy="168" r="1.8" />
    <circle cx="250" cy="166" r="2.0" />
    <circle cx="112" cy="192" r="1.7" />
    <circle cx="248" cy="190" r="1.9" />
    <circle cx="120" cy="216" r="1.8" />
    <circle cx="240" cy="214" r="1.8" />
    <circle cx="134" cy="238" r="1.7" />
    <circle cx="226" cy="236" r="1.9" />
    <circle cx="152" cy="256" r="1.8" />
    <circle cx="208" cy="254" r="1.6" />
    <circle cx="172" cy="268" r="1.7" />
    <circle cx="188" cy="268" r="1.8" />
  </g>

  <!-- Interior Lattice Points (Depth and Dimension in Garnet-Wine) -->
  <g fill="#6B0D1A" opacity="0.82">
    <circle cx="156" cy="118" r="1.5" />
    <circle cx="176" cy="113" r="1.6" />
    <circle cx="194" cy="115" r="1.4" />
    <circle cx="139" cy="158" r="1.7" />
    <circle cx="159" cy="150" r="1.6" />
    <circle cx="201" cy="153" r="1.7" />
    <circle cx="221" cy="160" r="1.5" />
    <circle cx="142" cy="183" r="1.6" />
    <circle cx="162" cy="191" r="1.7" />
    <circle cx="198" cy="189" r="1.6" />
    <circle cx="218" cy="181" r="1.5" />
    <circle cx="157" cy="223" r="1.5" />
    <circle cx="177" cy="228" r="1.6" />
    <circle cx="195" cy="225" r="1.5" />
  </g>

  <!-- Five Distinguishable Inner Nuclei Clusters at exact WebGL positions -->

  <!-- Cluster 1: Upper-Left (152, 162) - Deep Garnet Core & Wine Halos -->
  <g>
    <circle cx="152" cy="162" r="3.2" fill="#1A0306" />
    <circle cx="155" cy="165" r="2.7" fill="#26050A" />
    <circle cx="149" cy="165" r="2.4" fill="#38080F" />
    <circle cx="156" cy="159" r="2.2" fill="#4D0912" />
    <circle cx="147" cy="161" r="1.8" fill="#6B0D1A" />
    <circle cx="158" cy="168" r="1.9" fill="#7D1020" />
    <circle cx="150" cy="169" r="1.6" fill="#4D0912" />
    <circle cx="159" cy="162" r="1.7" fill="#7D1020" />
  </g>

  <!-- Cluster 2: Lower-Right (205, 198) - Deep Garnet Core & Wine Halos -->
  <g>
    <circle cx="205" cy="198" r="3.2" fill="#1A0306" />
    <circle cx="202" cy="195" r="2.7" fill="#26050A" />
    <circle cx="208" cy="201" r="2.5" fill="#38080F" />
    <circle cx="200" cy="200" r="2.2" fill="#4D0912" />
    <circle cx="210" cy="196" r="1.9" fill="#6B0D1A" />
    <circle cx="197" cy="197" r="1.7" fill="#7D1020" />
    <circle cx="212" cy="204" r="1.6" fill="#4D0912" />
    <circle cx="203" cy="203" r="1.8" fill="#7D1020" />
  </g>

  <!-- Cluster 3: Upper-Right (201, 157) - Deep Garnet Core & Wine Halos -->
  <g>
    <circle cx="201" cy="157" r="3.0" fill="#1A0306" />
    <circle cx="198" cy="160" r="2.6" fill="#26050A" />
    <circle cx="204" cy="161" r="2.3" fill="#38080F" />
    <circle cx="204" cy="154" r="2.0" fill="#4D0912" />
    <circle cx="195" cy="155" r="1.8" fill="#6B0D1A" />
    <circle cx="207" cy="164" r="1.6" fill="#7D1020" />
    <circle cx="199" cy="163" r="1.7" fill="#4D0912" />
  </g>

  <!-- Cluster 4: Lower-Left (157, 201) - Deep Garnet Core & Wine Halos -->
  <g>
    <circle cx="157" cy="201" r="3.0" fill="#1A0306" />
    <circle cx="160" cy="198" r="2.6" fill="#26050A" />
    <circle cx="154" cy="204" r="2.2" fill="#38080F" />
    <circle cx="161" cy="203" r="2.1" fill="#4D0912" />
    <circle cx="153" cy="199" r="1.8" fill="#6B0D1A" />
    <circle cx="163" cy="196" r="1.7" fill="#7D1020" />
    <circle cx="159" cy="206" r="1.6" fill="#4D0912" />
  </g>

  <!-- Cluster 5: Central Core (182, 177) - Deepest Obsidian-Garnet Nucleus -->
  <g>
    <circle cx="182" cy="177" r="3.8" fill="#140205" />
    <circle cx="180" cy="175" r="3.2" fill="#1A0306" />
    <circle cx="185" cy="179" r="2.8" fill="#26050A" />
    <circle cx="178" cy="180" r="2.5" fill="#38080F" />
    <circle cx="186" cy="174" r="2.3" fill="#4D0912" />
    <circle cx="175" cy="175" r="2.0" fill="#6B0D1A" />
    <circle cx="189" cy="181" r="1.8" fill="#7D1020" />
    <circle cx="180" cy="184" r="1.7" fill="#7D1020" />
    <circle cx="174" cy="181" r="1.5" fill="#4D0912" />
  </g>

  <!-- Fine Foreground Spark Accent Nodes (Dark Wine Sparks) -->
  <g fill="#8C1221" opacity="0.95">
    <circle cx="182" cy="177" r="1.2" fill="#4D0912" />
    <circle cx="152" cy="162" r="1.1" fill="#4D0912" />
    <circle cx="205" cy="198" r="1.1" fill="#4D0912" />
    <circle cx="201" cy="157" r="1.0" fill="#4D0912" />
    <circle cx="157" cy="201" r="1.0" fill="#4D0912" />
  </g>
</svg>
