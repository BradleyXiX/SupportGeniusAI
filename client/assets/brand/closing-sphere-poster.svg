    <circle cx="174" cy="104" r="1.6" />
    <circle cx="196" cy="106" r="1.4" />
    <circle cx="130" cy="160" r="1.7" />
    <circle cx="154" cy="150" r="1.6" />
    <circle cx="206" cy="154" r="1.7" />
    <circle cx="230" cy="162" r="1.5" />
    <circle cx="134" cy="190" r="1.6" />
    <circle cx="158" cy="200" r="1.7" />
    <circle cx="202" cy="198" r="1.6" />
    <circle cx="226" cy="188" r="1.5" />
    <circle cx="152" cy="240" r="1.5" />
    <circle cx="176" cy="246" r="1.6" />
    <circle cx="198" cy="242" r="1.5" />
