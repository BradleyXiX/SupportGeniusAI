<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="avatar-depth" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38080F" stop-opacity="0.90" />
      <stop offset="60%" stop-color="#26050A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#101012" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Spherical depth envelope -->
  <circle cx="16" cy="16" r="14" fill="url(#avatar-depth)" stroke="#26262a" stroke-width="1" />

  <!-- Outer orbital contour (deep wine) -->
  <ellipse cx="16" cy="16" rx="12.5" ry="5.5" stroke="#4D0912" stroke-width="0.85" transform="rotate(-22 16 16)" stroke-dasharray="2 3" opacity="0.85" />

  <!-- Inner active orbital ribbon (crimson) -->
  <ellipse cx="16" cy="16" rx="11" ry="3.8" stroke="#BB1729" stroke-width="0.9" transform="rotate(15 16 16)" opacity="0.95" />

  <!-- Garnet nucleus core -->
  <circle cx="16" cy="16" r="3.2" fill="#BB1729" />

  <!-- Luminous warm-white center spark -->
  <circle cx="16" cy="16" r="1.4" fill="#F7F7F5" />

  <!-- Fine satellite node sparks -->
  <circle cx="13.2" cy="14.2" r="0.85" fill="#F7F7F5" opacity="0.9" />
  <circle cx="18.8" cy="17.6" r="0.75" fill="#F7F7F5" opacity="0.9" />
</svg>
